plugins {
    id 'com.android.application'
}

android {
    namespace 'org.cigaes.binaural_player'
    compileSdk 35

    defaultConfig {
        applicationId 'org.cigaes.binaural_player'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
        }
    }
}